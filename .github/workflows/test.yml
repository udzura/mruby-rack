name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: actions/checkout@v4
        with:
          repository: picoruby/picoruby
          path: picoruby
      - run: PICORUBY_ROOT="$GITHUB_WORKSPACE/picoruby" rake test
